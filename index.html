<style>
/* =========================================================
   EINSTELLUNGEN – hier anpassen
   (die eigentlichen Werte stehen weiter unten im <script>)
   ========================================================= */
:root{
  --bg:#000000;          /* Hintergrund schwarz */
  --surface:#151515;     /* Karten / Antwortfelder */
  --ink:#F4F4F4;         /* Fließtext */
  --muted:#ABABAB;       /* Nebentext */
  --accent:#FF6A00;      /* knalliges Orange: Überschriften, Buttons */
  --accent-ink:#000000;  /* Schrift auf orangen Buttons */
  --sun:#FFB238;         /* Batterie / Fokusrahmen */
  --line:#353535;
  --danger:#FF7A6E;
  --radius-lg:22px;
  --radius:14px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
h1,h2,.q{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;color:var(--accent)}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}

.wrap{max-width:560px;margin:0 auto;padding:20px 20px 48px;min-height:100svh;display:flex;flex-direction:column}

/* ---------- Kopfzeile mit Fortschritt ---------- */
.top{display:flex;align-items:center;gap:14px;min-height:44px;margin-bottom:28px}
.back{background:none;border:0;padding:8px 0;color:var(--muted);cursor:pointer;font-weight:500;white-space:nowrap}
.back:hover{color:var(--ink)}
.back[hidden],.top[hidden]{display:none}
.bar{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .35s ease}
.count{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- Intro ---------- */
.hero{display:flex;flex-direction:column;gap:20px;padding-top:8px}
.intro-head{display:flex;gap:16px;align-items:center}
.photo{flex:none;width:112px;margin:0;border-radius:18px;overflow:hidden;aspect-ratio:4/5;background:var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.intro-head .who{font-size:15px;color:var(--muted);margin:0 0 4px}
.hero h1{font-size:clamp(24px,6.8vw,40px);line-height:1.05;margin:0}
.story p{margin:0 0 12px}
.motto{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:22px;line-height:1.2;color:var(--ink);border-left:4px solid var(--accent);padding-left:12px;margin:4px 0 0}
.offer{background:var(--surface);border-radius:var(--radius-lg);padding:22px;margin-top:8px;border:1px solid var(--line)}
.offer h2{font-size:24px;margin:0 0 6px;line-height:1.15}
.offer p{margin:0 0 18px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;padding:0;list-style:none}
.meta li{font-size:14px;background:var(--bg);border-radius:20px;padding:5px 12px;color:var(--ink)}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.topics li{font-size:13px;border:1.5px solid var(--accent);border-radius:20px;padding:4px 10px;color:var(--ink);white-space:nowrap}
.topics li.br{flex-basis:100%;height:0;padding:0;border:0;margin:0}
@media (min-width:480px){.topics{flex-wrap:nowrap}.topics li.br{display:none}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--radius);
  padding:16px 22px;font-weight:600;font-size:17px;cursor:pointer;text-decoration:none;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}

/* ---------- Fragen ---------- */
.screen{flex:1;display:flex;flex-direction:column}
.q{font-size:clamp(26px,6.6vw,32px);line-height:1.15;margin:0 0 8px}
.hint{color:var(--muted);margin:0 0 22px;font-size:15px}
.hint:empty{display:none}
.q + .opts{margin-top:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.yn{flex-direction:row}
.opts.yn .opt{flex:1;justify-content:center;font-size:19px;padding:20px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);
  padding:15px 16px;cursor:pointer;font-weight:500;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.tick{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.opt[aria-checked="true"] .tick{background:var(--accent);border-color:var(--accent)}
.tick svg{width:14px;height:14px;opacity:0}
.opt[aria-checked="true"] .tick svg{opacity:1}

/* Energie-Batterie */
.battery{display:flex;align-items:center;gap:6px;margin-top:22px}
.battery .cells{flex:1;display:flex;gap:6px;background:var(--surface);border:3px solid var(--ink);border-radius:14px;padding:6px}
.battery .nub{width:8px;height:26px;background:var(--ink);border-radius:0 4px 4px 0}
.cell{flex:1;height:64px;border:0;border-radius:7px;background:var(--line);cursor:pointer;transition:background .2s}
.cell.on{background:var(--sun)}
.cell.on.low{background:#E8743B}
.battery-label{margin-top:14px;font-weight:600;min-height:1.5em;font-size:18px}
.scale-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:6px;padding-right:14px}

/* Freitext */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:15px}
.field small{color:var(--muted);font-weight:400}
.input{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:14px 15px;font-size:17px}
.input:focus{border-color:var(--accent);outline:none}
textarea.input{min-height:120px;resize:vertical}
.follow{margin-top:18px}
.follow[hidden]{display:none}

.actions{margin-top:auto;padding-top:28px}

/* Kontakt */
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:14px 15px;margin-top:10px;font-size:15px;line-height:1.45}
.check input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent)}
.error{color:var(--danger);font-size:15px;margin:12px 0 0;font-weight:500}
.error:empty{display:none}
.note{color:var(--muted);font-size:13px;margin-top:14px}

/* Danke */
.done{text-align:left;padding-top:24px}
.done .mark{width:72px;height:72px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin-bottom:22px}
.done h1{font-size:clamp(34px,9vw,46px);line-height:1.05;margin:0 0 14px}
.done p{margin:0 0 14px}

footer{margin-top:40px;font-size:13px;color:var(--muted);display:flex;gap:16px}
footer a{color:var(--muted)}
.testmode{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#000;font-size:13px;padding:6px 12px;border-radius:20px;white-space:nowrap}

.fade{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}}
@media (max-width:380px){.opts.yn{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top" hidden>
    <button class="back" id="back" type="button">‹ Back</button>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <span class="count" id="count"></span>
  </div>
  <main id="app" aria-live="polite"></main>
  <footer id="footer"></footer>
</div>

<script>
/* =========================================================
   EINSTELLUNGEN – hier anpassen
   ========================================================= */
const CONFIG = {
  // 1) Kostenlosen Access Key auf https://web3forms.com holen (deine E-Mail eintragen)
  //    und hier einfügen. Solange hier der Platzhalter steht, läuft die Seite im Testmodus.
  WEB3FORMS_KEY: "d1ab4d85-427a-4752-914a-50b84ab85fd7",

  NAME: "Michael Schwind",
  VORNAME: "Michael",
  INSTAGRAM_URL: "https://www.instagram.com/juiceguy.michael.us/",
  DATENSCHUTZ_URL: "privacy.html",    // Link zu deiner Datenschutzerklärung
  IMPRESSUM_URL: "imprint.html"         // Link zu deinem Impressum
};

/* =========================================================
   FRAGEN
   type: yn (Ja/Nein), single, multi, energy, text
   follow: Zusatzfeld, das bei einer bestimmten Antwort erscheint
   ========================================================= */
const QUESTIONS = [
  { id:"ziele", type:"multi", q:"What would you like to achieve?", hint:"Select all that apply.", short:"Goals",
    options:["Live healthier & fitter","More energy & performance","Lose weight","Strengthen my immune system","Boost my metabolism","Reduce discomfort","Build muscle","Just curious"] },
  { id:"energie", type:"energy", q:"How would you rate your energy level right now?", hint:"Tap the battery.", short:"Energy level",
    labels:["Very low","Fairly low","Medium","Good","Very good"] },
  { id:"schlaf", type:"yn", q:"Do you fall asleep easily and sleep through the night?", short:"Sleeps well" },
  { id:"tief", type:"yn", q:"Do you often feel unmotivated or hit an afternoon slump?", short:"Low drive / afternoon slump" },
  { id:"verdauung", type:"yn", q:"Do you have stomach, gut, or digestive issues?", hint:"For example bloating, diarrhea, or constipation.", short:"Digestive issues" },
  { id:"unvertr", type:"yn", q:"Do you have any food intolerances?", short:"Food intolerances",
    follow:{ on:"Yes", label:"Which ones?", placeholder:"e.g., lactose, gluten" } },
  { id:"allergien", type:"yn", q:"Do you have any allergies?", short:"Allergies",
    follow:{ on:"Yes", label:"Which ones?", placeholder:"e.g., pollen, nuts" } },
  { id:"kopf", type:"yn", q:"Are you prone to headaches or migraines?", short:"Headaches / migraines" },
  { id:"gelenke", type:"yn", q:"Do you have nerve, muscle, or joint problems?", short:"Nerves / muscles / joints" },
  { id:"gewicht", type:"yn", q:"Are you happy with your weight?", short:"Happy with weight",
    follow:{ on:"No", label:"What would you like to change?", placeholder:"e.g., lose 10 lbs" } },
  { id:"herz", type:"yn", q:"Do you have any heart or circulation issues?", short:"Heart / circulation",
    follow:{ on:"Yes", label:"Which ones?", placeholder:"e.g., high blood pressure, low blood pressure, frequent dizziness" } },
  { id:"chronisch", type:"yn", q:"Do you have a chronic condition?", short:"Chronic condition",
    follow:{ on:"Yes", label:"Which one?", placeholder:"" } },
  { id:"medis", type:"yn", q:"Do you take any medication regularly?", short:"Medication",
    follow:{ on:"Yes", label:"Which ones?", placeholder:"" } },
  { id:"wunsch", type:"text", optional:true, q:"What would you most like to change about your health or your daily life?",
    hint:"Optional. Just write whatever is on your mind right now.", short:"Wish / free text" }
];
const TOTAL = QUESTIONS.length + 1; // + Kontaktseite

/* ========================================================= */
const state = { step:-1, answers:{}, follow:{}, contact:{name:"",phone:"",email:"",insta:"",business:false,consent:false} };
const app = document.getElementById("app");
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const checkSvg = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 4.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const isTest = !CONFIG.WEB3FORMS_KEY || CONFIG.WEB3FORMS_KEY === "DEIN-ACCESS-KEY";
let advanceTimer = null;


function go(step){
  clearTimeout(advanceTimer);
  state.step = step;
  render();
  window.scrollTo({top:0});
}
function next(){ go(state.step + 1); }
function autoNext(){ clearTimeout(advanceTimer); advanceTimer = setTimeout(next, 320); }

function renderTop(){
  const top = $("#top");
  const s = state.step;
  if (s < 0 || s > QUESTIONS.length){ top.hidden = true; return; }
  top.hidden = false;
  const n = s + 1;
  $("#count").textContent = `${n} of ${TOTAL}`;
  $("#barFill").style.width = (n / TOTAL * 100) + "%";
}

function render(){
  renderTop();
  const s = state.step;
  let html;
  if (s < 0) html = introHTML();
  else if (s < QUESTIONS.length) html = questionHTML(QUESTIONS[s]);
  else if (s === QUESTIONS.length) html = contactHTML();
  else html = doneHTML();
  app.innerHTML = `<div class="screen fade">${html}</div>`;
  bind();
  const focusable = app.querySelector("[data-autofocus]") || app.querySelector("h1, .q");
  if (focusable && s >= 0){ focusable.setAttribute("tabindex","-1"); focusable.focus({preventScroll:true}); }
}

/* ---------- Screens ---------- */
function introHTML(){
  return `
  <section class="hero">
    <div class="intro-head">
      <figure class="photo"><img src="${HERO_IMG}" alt="${esc(CONFIG.NAME)}"></figure>
      <div>
        <p class="who">${esc(CONFIG.VORNAME)}, 28, from Germany</p>
        <!-- ÜBERSCHRIFT -->
        <h1>From Banker to Global Juice Dealer</h1>
      </div>
    </div>
    <ul class="topics"><li>Energy</li><li>Recovery</li><li>Inspiration</li><li class="br" aria-hidden="true"></li><li>Travel</li><li>Plan B</li></ul>
    <div class="story">
      <p>During my career as a bank advisor, I realized that the best investment you can make is in your own health.</p>
      <p>Today I help people get healthier and, if they want, build more financial freedom too.</p>
    </div>
    <p class="motto">It's so much more than just juice.</p>
    <div class="offer">
      <h2>How fit are you really right now?</h2>
      <p>Take the Vital Check. Afterward, we'll go over your answers together, free and with no obligation.</p>
      <ul class="meta"><li>${TOTAL} quick questions</li><li>about 2 minutes</li><li>free</li></ul>
      <button class="btn" data-act="start" type="button">Start the Vital Check</button>
    </div>
  </section>`;
}

function questionHTML(q){
  const a = state.answers[q.id];
  let body = "";
  let showNext = false, nextDisabled = false;

  if (q.type === "yn"){
    body = `<div class="opts yn" role="group">` +
      ["Yes","No"].map(v => `<button type="button" class="opt" data-val="${v}" aria-pressed="${a===v}">${v}</button>`).join("") +
      `</div>`;
    if (q.follow){
      const open = a === q.follow.on;
      body += `<div class="follow field" ${open?"":"hidden"}>
        <label for="f_${q.id}">${esc(q.follow.label)} <small>(optional)</small></label>
        <input class="input" id="f_${q.id}" type="text" placeholder="${esc(q.follow.placeholder||"")}" value="${esc(state.follow[q.id]||"")}" ${open?"data-autofocus":""}>
      </div>`;
    }
    showNext = a !== undefined;
  }
  else if (q.type === "single"){
    body = `<div class="opts" role="group">` + q.options.map(v =>
      `<button type="button" class="opt" data-val="${esc(v)}" aria-pressed="${a===v}">${esc(v)}</button>`).join("") + `</div>`;
    showNext = a !== undefined;
  }
  else if (q.type === "multi"){
    const sel = a || [];
    body = `<div class="opts" role="group">` + q.options.map(v =>
      `<button type="button" role="checkbox" class="opt" data-multi="${esc(v)}" aria-checked="${sel.includes(v)}"><span class="tick">${checkSvg}</span>${esc(v)}</button>`).join("") + `</div>`;
    showNext = true; nextDisabled = sel.length === 0;
  }
  else if (q.type === "energy"){
    const lvl = a || 0;
    body = `<div class="battery" role="radiogroup" aria-label="Energy level">
        <div class="cells">${[1,2,3,4,5].map(i =>
          `<button type="button" class="cell ${i<=lvl?"on":""} ${lvl<=2?"low":""}" role="radio" aria-checked="${lvl===i}" aria-label="${i} of 5: ${q.labels[i-1]}" data-lvl="${i}"></button>`).join("")}
        </div><div class="nub"></div>
      </div>
      <div class="scale-ends"><span>empty</span><span>full</span></div>
      <div class="battery-label">${lvl ? esc(q.labels[lvl-1]) : ""}</div>`;
    showNext = !!lvl;
  }
  else if (q.type === "text"){
    body = `<div class="field"><textarea class="input" id="t_${q.id}" data-autofocus placeholder="Your thoughts…">${esc(a||"")}</textarea></div>`;
    showNext = true;
  }

  const nextLabel = (q.type === "text" && !(a||"").trim()) ? "Skip" : "Next";
  return `
    <h1 class="q">${esc(q.q)}</h1>
    <p class="hint">${esc(q.hint||"")}</p>
    ${body}
    <div class="actions">${showNext ? `<button class="btn" data-act="next" type="button" ${nextDisabled?"disabled":""}>${nextLabel}</button>` : ""}</div>`;
}

function contactHTML(){
  const c = state.contact;
  return `
    <h1 class="q">How can I reach you?</h1>
    <p class="hint">All I need is your name and at least one way to reach you.</p>
    <div class="field"><label for="c_name">First and last name</label>
      <input class="input" id="c_name" autocomplete="name" value="${esc(c.name)}" data-autofocus></div>
    <div class="field"><label for="c_phone">Phone / WhatsApp</label>
      <input class="input" id="c_phone" type="tel" autocomplete="tel" inputmode="tel" value="${esc(c.phone)}"></div>
    <div class="field"><label for="c_email">Email</label>
      <input class="input" id="c_email" type="email" autocomplete="email" inputmode="email" value="${esc(c.email)}"></div>
    <div class="field"><label for="c_insta">Instagram handle</label>
      <input class="input" id="c_insta" autocapitalize="off" autocomplete="off" placeholder="@yourname" value="${esc(c.insta)}"></div>

    <label class="check"><input type="checkbox" id="c_business" ${c.business?"checked":""}>
      <span>I'm also interested in how you built your own business.</span></label>

    <label class="check"><input type="checkbox" id="c_consent" ${c.consent?"checked":""}>
      <span>Submitting this form is free, and the follow-up consultation is free and comes with no obligation.
      I consent to ${esc(CONFIG.NAME)} storing and using my information, including my health information,
      to contact me and advise me. I can withdraw my consent at any time.
      <a href="${esc(CONFIG.DATENSCHUTZ_URL)}" target="_blank" rel="noopener">Privacy Policy</a></span></label>

    <p class="error" id="err" role="alert"></p>
    <p class="note">The Vital Check is not a substitute for a medical exam or diagnosis.</p>
    <div class="actions"><button class="btn" data-act="submit" type="button">Submit the Vital Check</button></div>`;
}

function doneHTML(){
  const first = (state.contact.name||"").trim().split(/\s+/)[0];
  return `
    <section class="done">
      <div class="mark"><svg width="34" height="34" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 4.5" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1>Thank you${first?", "+esc(first):""}!</h1>
      <p>Your Vital Check has arrived.</p>
      <p>I'll look over your answers and reach out to you personally within the next few days.</p>
      <div class="actions"><a class="btn ghost" href="${esc(CONFIG.INSTAGRAM_URL)}">Back to Instagram</a></div>
    </section>`;
}

/* ---------- Events ---------- */
function bind(){
  const s = state.step;
  const q = QUESTIONS[s];

  const start = $('[data-act="start"]', app);
  if (start) start.onclick = () => go(0);

  const nx = $('[data-act="next"]', app);
  if (nx) nx.onclick = () => { saveText(); next(); };

  app.querySelectorAll("[data-val]").forEach(b => b.onclick = () => {
    state.answers[q.id] = b.dataset.val;
    if (q.follow && b.dataset.val === q.follow.on){ render(); return; }
    if (q.follow) delete state.follow[q.id];
    render(); autoNext();
  });

  app.querySelectorAll("[data-multi]").forEach(b => b.onclick = () => {
    const sel = state.answers[q.id] || [];
    const v = b.dataset.multi;
    state.answers[q.id] = sel.includes(v) ? sel.filter(x=>x!==v) : [...sel, v];
    const on = state.answers[q.id].includes(v);
    b.setAttribute("aria-checked", on);
    $('[data-act="next"]', app).disabled = state.answers[q.id].length === 0;
  });

  app.querySelectorAll("[data-lvl]").forEach(b => b.onclick = () => {
    state.answers[q.id] = +b.dataset.lvl; render(); autoNext();
  });

  const sub = $('[data-act="submit"]', app);
  if (sub) sub.onclick = submit;
}

function saveText(){
  const q = QUESTIONS[state.step];
  if (!q) return;
  if (q.type === "text"){ state.answers[q.id] = $("#t_"+q.id).value; }
  if (q.follow){ const f = $("#f_"+q.id); if (f && !f.closest("[hidden]")) state.follow[q.id] = f.value; }
}

function readContact(){
  const c = state.contact;
  c.name = $("#c_name").value.trim();
  c.phone = $("#c_phone").value.trim();
  c.email = $("#c_email").value.trim();
  c.insta = $("#c_insta").value.trim();
  c.business = $("#c_business").checked;
  c.consent = $("#c_consent").checked;
}

document.getElementById("back").onclick = () => {
  if (state.step === QUESTIONS.length) readContact(); else saveText();
  go(state.step - 1);
};

document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.shiftKey || e.target.tagName === "TEXTAREA" || e.target.tagName === "BUTTON" || e.target.tagName === "A") return;
  const btn = $('[data-act="next"]:not([disabled])', app) || $('[data-act="submit"]', app);
  if (btn){ e.preventDefault(); btn.click(); }
});

/* ---------- Absenden ---------- */
function formatAnswer(q){
  const a = state.answers[q.id];
  if (a === undefined || a === "" || (Array.isArray(a) && !a.length)) return "–";
  if (q.type === "energy") return `${a} of 5 (${q.labels[a-1]})`;
  if (Array.isArray(a)) return a.join(", ");
  let out = String(a);
  if (q.follow && a === q.follow.on && state.follow[q.id]) out += ` – ${state.follow[q.id]}`;
  return out;
}

async function submit(){
  readContact();
  const c = state.contact, err = $("#err"), btn = $('[data-act="submit"]', app);
  err.textContent = "";
  if (!c.name){ err.textContent = "Please enter your name."; $("#c_name").focus(); return; }
  if (!c.phone && !c.email && !c.insta){ err.textContent = "Please enter at least a phone number, email, or Instagram handle."; $("#c_phone").focus(); return; }
  if (c.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)){ err.textContent = "That email address looks incomplete."; $("#c_email").focus(); return; }
  if (!c.consent){ err.textContent = "Please check the consent box so I'm allowed to contact you."; $("#c_consent").focus(); return; }

  const payload = {
    access_key: CONFIG.WEB3FORMS_KEY,
    subject: `Neuer Vitalcheck (USA) von ${c.name}`,
    from_name: "Vitalcheck USA",
    "Name": c.name,
    "Telefon / WhatsApp": c.phone || "–",
    "E-Mail": c.email || "–",
    "Instagram": c.insta || "–",
    "Interesse am Business": c.business ? "Ja" : "Nein",
    "Einwilligung erteilt": "Ja, " + new Date().toLocaleString("de-DE"),
    botcheck: ""
  };
  if (c.email) payload.replyto = c.email;
  QUESTIONS.forEach((q, i) => { payload[`${String(i+1).padStart(2,"0")}. ${q.short}`] = formatAnswer(q); });

  if (isTest){
    console.log("TESTMODUS – würde gesendet:", payload);
    go(QUESTIONS.length + 1);
    return;
  }

  btn.disabled = true; btn.textContent = "Sending…";
  try{
    const r = await fetch("https://api.web3forms.com/submit", {
      method:"POST", headers:{ "Content-Type":"application/json", Accept:"application/json" },
      body: JSON.stringify(payload)
    });
    const data = await r.json().catch(()=>({}));
    if (!r.ok || data.success === false) throw new Error(data.message || r.status);
    go(QUESTIONS.length + 1);
  }catch(e){
    btn.disabled = false; btn.textContent = "Submit the Vital Check";
    err.textContent = "Sending didn't work. Check your internet connection and tap “Submit the Vital Check” again.";
  }
}
